<!DOCTYPE html>
<html>

<head>
   <title>Jogo</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <style>
      #crosshair {
         position: fixed;
         top: 50%;
         left: 50%;
         width: 20px;
         height: 20px;
         margin-left: -10px;
         margin-top: -10px;
         border: 1px solid #fff;
         border-radius: 50%;

         pointer-events: none;
         z-index: 1000;
      }

      .crosshair-line {
         position: absolute;
         background-color: #fff;
      }

      .crosshair-line.top {
         top: 0;
         left: 50%;
         width: 2px;
         height: 10px;
         margin-left: -1px;
      }

      .crosshair-line.bottom {
         bottom: 0;
         left: 50%;
         width: 2px;
         height: 10px;
         margin-left: -1px;
      }

      .crosshair-line.left {
         top: 50%;
         left: 0;
         width: 10px;
         height: 2px;
         margin-top: -1px;
      }

      .crosshair-line.right {
         top: 50%;
         right: 0;
         width: 10px;
         height: 2px;
         margin-top: -1px;
      }

      #key-counter {
         position: fixed;
         bottom: 30px;
         left: 30px;

         display: none;
         align-items: center;
         gap: 12px;

         padding: 10px 18px;

         background: rgba(0, 0, 0, 0.75);
         border: 1px solid rgba(102, 255, 204, 0.6);
         border-radius: 5px;

         color: #66ffcc;
         font-family: Arial, sans-serif;
         font-size: 22px;
         font-weight: bold;

         text-shadow: 0 0 8px #00ffaa;
         box-shadow: 0 0 12px rgba(0, 255, 170, 0.2);

         pointer-events: none;
         z-index: 1000;
      }

      #key-icon {
         font-size: 26px;
      }
   </style>
</head>

<body>

   <div id="crosshair">
      <div class="crosshair-line top"></div>
      <div class="crosshair-line bottom"></div>
      <div class="crosshair-line left"></div>
      <div class="crosshair-line right"></div>
   </div>

   <div id="key-counter">
      <span id="key-icon">🗝</span>
      <span id="key-count">0</span>
   </div>

   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
         {"imports": {"three": "../build/three.module.js"}} 
      </script>

   <div id="webgl-output">
      <script type="module" src="Jogo.js"></script>
   </div>
</body>

</html>
