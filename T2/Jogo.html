<!DOCTYPE html>
<html>
   <head>
      <title>Jogo</title>

      <link rel="shortcut icon" href="../favicon.ico">
      <link rel="stylesheet" href="../html/resources/default.css">
      <meta name="viewport" content="width=device-width, initial-scale=1">  

      <style>
         #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            border: 1px solid #fff;
            border-radius: 50%;

            pointer-events: none;
            z-index: 1000;
         }

         .crosshair-line {
            position: absolute;
            background-color: #fff;
         }

         .crosshair-line.top{
            top: 0;
            left: 50%;
            width: 2px;
            height: 10px;
            margin-left: -1px;
         }

         .crosshair-line.bottom{
            bottom: 0;
            left: 50%;
            width: 2px;
            height: 10px;
            margin-left: -1px;
         }

         .crosshair-line.left{
            top: 50%;
            left: 0;
            width: 10px;
            height: 2px;
            margin-top: -1px;
         }

         .crosshair-line.right{
            top: 50%;
            right: 0;
            width: 10px;
            height: 2px;
            margin-top: -1px;
         }
      </style>
   </head>

   <body>

      <div id="crosshair">
         <div class="crosshair-line top"></div>
         <div class="crosshair-line bottom"></div>
         <div class="crosshair-line left"></div>
         <div class="crosshair-line right"></div>
      </div>
      
      <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
      <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
      <script type="importmap"> 
         {"imports": {"three": "../build/three.module.js"}} 
      </script>  

      <div id="webgl-output">     
         <script type="module" src="Jogo.js"></script>
      </div>
   </body>
</html>
